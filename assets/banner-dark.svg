<svg xmlns="http://www.w3.org/2000/svg"
    width="1200"
    height="500"
    viewBox="0 0 1200 500">
<defs>
    <clipPath id="profileClip">
        <circle
            cx="190"
            cy="174"
            r="55"/>
    </clipPath>
    <filter id="avatarGlow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="5" result="blur"/>
        <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
    </feMerge>
</filter>
    <filter id="cardShadow"
        x="-20%"
        y="-20%"
        width="140%"
        height="140%">

    <feDropShadow
        dx="0"
        dy="8"
        stdDeviation="12"
        flood-color="#000000"
        flood-opacity="0.45"/>
</filter>
    <filter id="greenGlow" x="-200%" y="-200%" width="500%" height="500%">
    <feGaussianBlur
        in="SourceGraphic"
        stdDeviation="3"
        result="blur"/>

    <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
    </feMerge>
</filter>
</defs>
    <!-- Background -->
    <rect width="1200" height="500" fill="#0D1117"/>

    <!-- Terminal Window -->
    <rect
        x="40"
        y="30"
        width="1120"
        height="440"
        rx="18"
        fill="#161B22"
        stroke="#30363D"
        stroke-width="2"/>

    <!-- Top Bar -->
    <rect
        x="40"
        y="30"
        width="1120"
        height="40"
        rx="18"
        fill="#21262D"/>

    <!-- Window Buttons -->
    <circle cx="70" cy="50" r="6" fill="#FF5F56"/>
    <circle cx="95" cy="50" r="6" fill="#FFBD2E"/>
    <circle cx="120" cy="50" r="6" fill="#27C93F"/>

    <!-- Title -->
    <text
        x="170"
        y="56"
        fill="white"
        font-size="18"
        font-family="Arial">
        profile.sh
    </text>

    <!-- Left Placeholder -->
    <rect
        x="80"
        y="105"
        width="240"
        height="250"
        rx="16"
        fill="#21262D"
        stroke="#30363D"
        stroke-width="2"/>

    <text
        x="140"
        y="125"
        fill="#8B949E"
        font-size="14"
        font-family="Arial"
        alignment-baseline="middle">
        Developer Profile
        
    </text>

    <!-- Profile Image -->
    <image
        href="profile.png"
        x="135"
        y="145"
        width="110"
        height="115"
        clip-path="url(#profileClip)"/>
    <!-- Avatar Border -->
    <circle
        cx="190"
        cy="186"
        r="50"
        fill="none"
        stroke="#58a6ff"
        stroke-width="2.5"
        filter="url(#avatarGlow)"/>
    
    <text
        x="190"
        y="265"
        fill="white"
        font-size="18"
        font-family="Arial"
        font-weight="bold"
        text-anchor="middle">
        Arghaneel Das
    </text>

    <text
        x="190"
        y="287"
        fill="#8B949E"
        font-size="14"
        font-family="Arial"
        text-anchor="middle">
        Computer Science Student
    </text>

    <line
        x1="110"
        y1="293"
        x2="290"
        y2="293"
        stroke="#30363D"
        stroke-width="1.5"/>

    <text
        x="190"
        y="308"
        fill="#8B949E"
        font-size="12"
        font-family="Arial"
        text-anchor="middle">
        📍 Bangalore, India
    </text>

    <text
        x="190"
        y="327"
        fill="#58A6FF"
        font-size="12"
        font-family="Consolas, monospace"
        text-anchor="middle">
        @Arghaneel
    </text>

    <!-- Right Title -->
    <text
        x="380"
        y="102"
        fill="#58A6FF"
        font-size="26"
        font-family="Arial"
        font-weight="bold"
        opacity="0.8">
        SYSTEM.INFO
    </text>

    <!-- Status Component -->
    <rect
        x="370"
        y="110"
        width="150"
        height="26"
        rx="13"
        fill="#1B2A1F"
        stroke="#3FB950"
        stroke-width="1"
        filter="url(#cardShadow)"/>

    <circle
        cx="385"
        cy="123"
        r="6"
        fill="#3FB950"
        filter="url(#greenGlow)">

        <animate
            attributeName="opacity"
            values="1;0.6;1"
            dur="1.5s"
            repeatCount="indefinite"/>

</circle>

    <text
        x="400"
        y="128"
        fill="#3FB950"
        font-size="13"
        font-family="Arial"
        font-weight="bold">
        AVAILABLE
    </text>

    <!-- Information -->
    <text
        x="380"
        y="160"
        fill="#8B949E"
        font-size="16"
        font-family="Arial">
        Name
    </text>

    <text
        x="495"
        y="160"
        fill="#8B949E"
        font-size="16"
        font-family="Arial">
        :
    </text>

    <text
        x="515"
        y="160"
        fill="white"
        font-size="20"
        font-weight="bold"
        font-family="Arial">
        Arghaneel Das
    </text>

    <text
        x="380"
        y="200"
        fill="#8B949E"
        font-size="16"
        font-family="Arial">
        Role
    </text>

    <text
        x="495"
        y="200"
        fill="#8B949E"
        font-size="16"
        font-family="Arial">
        :
    </text>

    <text
        x="515"
        y="200"
        fill="white"
        font-size="20"
        font-weight="bold"
        font-family="Arial">
        Data Analyst
    </text>

    <text
        x="380"
        y="240"
        fill="#8B949E"
        font-size="16"
        font-family="Arial">
        Stack
    </text>

    <text
        x="495"
        y="240"
        fill="#8B949E"
        font-size="16"
        font-family="Arial">
        :
    </text>

    <text
        x="515"
        y="240"
        fill="white"
        font-size="20"
        font-weight="bold"
        font-family="Arial">
        Python • React • SQL
    </text>

    <!-- Terminal Prompt -->
    <text
        x="380"
        y="280"
        fill="#58A6FF"
        font-size="18"
        font-family="Consolas, monospace">
        $ git status
    </text>

    <!-- Output -->
    <text
        x="380"
        y="305"
        fill="#E6EDF3"
        font-size="18"
        font-family="Consolas, monospace">
        On branch main
    </text>
    <!-- Second Prompt -->
    <text
        x="380"
        y="335"
        fill="#58A6FF"
        font-size="18"
        font-family="Consolas, monospace">
        $ python roadmap.py
    </text>

    <!-- Second Output -->
    <text
        x="380"
        y="360"
        fill="#E6EDF3"
        font-size="18"
        font-family="Consolas, monospace">
        Learning Machine Learning...
    </text>

    <!-- Third Prompt -->
    <text
        x="380"
        y="390"
        fill="#58A6FF"
        font-size="18"
        font-family="Consolas, monospace">
        $_
    </text>
    <!-- Blinking Cursor -->
    <text
        x="395"
        y="390"
        fill="#58A6FF"
        font-size="18"
        font-family="Consolas, monospace">
        |
        <animate
            attributeName="opacity"
            values="1;0;1"
            dur="1s"
            repeatCount="indefinite"/>
    </text>

</svg>